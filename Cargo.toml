[package]
name = "umpv"
version = "1.1.2"
edition = "2024"

[dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
windows-registry = { version = "0.100.0", default-features = false }
windows-result = { version = "0.100.0", default-features = false }

[dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
version = "0.61.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
